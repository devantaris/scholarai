[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = -v --tb=short --strict-markers
markers =
    unit: Isolated unit tests for pure algorithms and models
    api: API endpoint integration tests
    tier1: Tier 1 Feature Coverage tests (F1-F7)
    tier2: Tier 2 Boundary & Corner Case tests
    tier3: Tier 3 Cross-Feature Combination tests
    tier4: Tier 4 Real-World Application Scenario tests
